name: PR Quick Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

env:
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  quick-check:
    name: Quick Check (Lint + Unit Tests + Build Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Verify Java setup
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          which java
          ls -la "$JAVA_HOME/bin/java"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          api-level: 34
          ndk-version: '26.1.10909125'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint (fast)
        run: ./gradlew lintDebug --no-daemon -x test

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK (verify compiles)
        run: ./gradlew assembleDebug --no-daemon --stacktrace -x lint -x test

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7