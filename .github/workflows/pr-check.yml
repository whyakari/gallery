name: PR Quick Check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  quick-check:
    name: Quick Check (Lint + Unit Tests + Build Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: '26.1.10909125'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint (fast)
        run: ./gradlew lintDebug --no-daemon -x test

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK (verify compiles)
        run: ./gradlew assembleDebug --no-daemon --stacktrace -x lint -x test

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7