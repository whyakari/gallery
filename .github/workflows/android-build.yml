name: Android Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx4g -XX:+HeapDumpOnOutOfMemoryError" -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true'

jobs:
  # ---------- Lint & Static Analysis ----------
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: '26.1.10909125'
          build-tools-version: '34.0.0'
          cmake-version: '3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 7

  # ---------- Unit Tests ----------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: '26.1.10909125'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  # ---------- Build Debug APK ----------
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: '26.1.10909125'
          build-tools-version: '34.0.0'
          cmake-version: '3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apks
          path: |
            app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Mapping File (for ProGuard/R8)
        uses: actions/upload-artifact@v7
        with:
          name: debug-mapping
          path: app/build/outputs/mapping/debug/mapping.txt
          retention-days: 30

  # ---------- Build Release APK / AAB ----------
  build-release:
    name: Build Release (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [lint, unit-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: '26.1.10909125'
          build-tools-version: '34.0.0'
          cmake-version: '3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APKs (split by density/ABI)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build Release Bundle (AAB)
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Upload Release Mapping File
        uses: actions/upload-artifact@v7
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

  # ---------- Instrumented Tests (with Emulator) ----------
  instrumented-tests:
    name: Instrumented Tests (Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-debug]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: '26.1.10909125'
          build-tools-version: '34.0.0'
          cmake-version: '3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create and start emulator
        uses: android-actions/create-emulator@v2
        with:
          api-level: 34
          arch: 'x86_64'
          target: 'google_apis'
          force-avd-creation: true
          emulator-options: '-no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2'

      - name: Wait for emulator
        run: |
          adb wait-for-device shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          adb shell input keyevent 82

      - name: Run Instrumented Tests
        run: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload Instrumented Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/connected/
          retention-days: 7

  # ---------- Dependency Check ----------
  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: 'MaterialExpressiveGallery'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report'
          args: '--disableRetireJS --disableNodeJS --disablePyPkg --disableRubyGems --disableCocoaPods --disableComposer --disableSwiftPM --disableNuGet --disableGo --disableRust --disableCMake --disableAutoconf --disableArchive'

      - name: Upload Dependency Check Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: dependency-check-report/
          retention-days: 30

  # ---------- Release (on tag) ----------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build-release]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: release-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/release-apks/*.apk
            artifacts/release-bundle/*.aab
            artifacts/release-mapping/mapping.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  # ---------- Summary ----------
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-debug, build-release, instrumented-tests, dependency-check]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          echo "=== Build Summary ==="
          echo "Lint: ${{ needs.lint.result }}"
          echo "Unit Tests: ${{ needs.unit-tests.result }}"
          echo "Build Debug: ${{ needs.build-debug.result }}"
          echo "Build Release: ${{ needs.build-release.result }}"
          echo "Instrumented Tests: ${{ needs.instrumented-tests.result }}"
          echo "Dependency Check: ${{ needs.dependency-check.result }}"

          # Fail if any required job failed
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.build-debug.result }}" != "success" ]] || \
             [[ "${{ needs.build-release.result }}" != "success" ]]; then
            echo "❌ Required jobs failed"
            exit 1
          fi
          echo "✅ All required jobs passed"